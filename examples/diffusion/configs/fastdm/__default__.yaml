# FastDM AdaRound calibration defaults.
#
# Stack this on top of a model config (e.g. configs/model/flux.1-schnell.yaml)
# to enable block-wise reconstruction with progressive timestep scheduling.
#
# Example:
#   python -m deepcompressor.app.diffusion.ptq \
#       configs/model/flux.1-schnell.yaml \
#       configs/fastdm/__default__.yaml
quant:
  enable_fastdm: true
  fastdm:
    adaround:
      enable: true
